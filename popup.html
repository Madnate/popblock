<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup Blocker</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; padding: 14px; }
    header { margin-bottom: 4px; }
    #version { font-size: 10px; }
    #host {
      margin: 0 0 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #pause-row { margin-top: 10px; }
    #pause-status { font-size: 11px; }

    #activity { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    #count {
      min-width: 22px;
      padding: 1px 6px;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
    }
    #log { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
    #log li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      border-radius: 5px;
      background: var(--surface);
    }
    .kind {
      font-size: 9px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 4px;
    }
    .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }

    footer { margin-top: 14px; font-size: 11px; }
    #shortcut { font-size: 10px; }
  </style>
</head>
<body>
  <header class="bar">
    <h1>POPUP BLOCKER</h1>
    <span id="version" class="muted"></span>
  </header>
  <p id="host">…</p>

  <button id="toggle" class="switch" role="switch" aria-checked="false" disabled>
    <span class="dot" aria-hidden="true"></span><span id="toggle-label">BLOCKING OFF</span>
  </button>
  <p id="rule" class="hint"></p>

  <div id="pause-row" class="row" hidden>
    <span id="pause-status" class="muted" role="status"></span>
    <button id="pause" class="btn">Pause 10 min</button>
  </div>

  <section id="activity" aria-labelledby="activity-title" hidden>
    <div class="row">
      <h2 id="activity-title">BLOCKED ON THIS PAGE</h2>
      <span id="count" aria-live="polite">0</span>
    </div>
    <ol id="log" aria-label="Last 10 blocked popups"></ol>
    <p id="log-empty" class="hint">Nothing blocked on this page yet.</p>
  </section>

  <footer class="bar">
    <button id="options" class="link">Options</button>
    <span id="shortcut" class="muted"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
