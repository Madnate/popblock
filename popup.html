<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      width: 240px;
      padding: 14px;
      background: #141414;
      color: #ddd;
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 12px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #888;
      font-weight: 600;
    }
    #host {
      margin: 0 0 12px;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #toggle {
      all: unset;
      box-sizing: border-box;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      background: #1a1a1a;
      color: #666;
      border: 1px solid #2a2a2a;
      transition: all 0.2s ease;
    }
    #toggle:hover { background: #222; border-color: #3a3a3a; }
    #toggle:focus-visible { outline: 2px solid #3ddc6e; outline-offset: 2px; }
    #toggle.on { color: #ddd; border-color: #1e4a2c; box-shadow: 0 0 0 1px #1e4a2c; }
    #toggle:disabled { cursor: not-allowed; opacity: 0.5; }
    #dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.25s, box-shadow 0.25s;
    }
    #toggle.on #dot { background: #3ddc6e; box-shadow: 0 0 6px #3ddc6eaa; }
    #hint { margin: 10px 0 0; color: #666; font-size: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>POPUP BLOCKER</h1>
  <p id="host">…</p>
  <button id="toggle" role="switch" aria-checked="false">
    <span id="dot"></span><span id="label">BLOCKER OFF</span>
  </button>
  <p id="hint"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
